<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 특산물 에이전트</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; background: #e8f1f8; display: flex; justify-content: center; }
  .chat { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #fff; }
  header { padding: .9rem 1rem; background: linear-gradient(135deg, #00a6d6, #3ddc97); color: #fff; font-weight: bold; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; background: #f6fafc; }
  .msg { max-width: 78%; padding: .6rem .9rem; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .me { align-self: flex-end; background: #ff9f1c; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #d5e3ec; border-bottom-left-radius: 4px; }
  form { display: flex; gap: .5rem; padding: .75rem; border-top: 1px solid #e0e0e0; }
  input { flex: 1; padding: .6rem .8rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 20px; }
  button { padding: .6rem 1.1rem; font-size: 1rem; border: 0; border-radius: 20px; background: #00a6d6; color: #fff; cursor: pointer; }
  .notice { text-align: center; font-size: .7rem; color: #999; padding: .3rem 0 .6rem; }
</style>
</head>
<body>
  <div class="chat">
    <header>🍊 제주 특산물 에이전트</header>
    <div id="log"></div>
    <form id="form">
      <input id="input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
      <button type="submit">보내기</button>
    </form>
    <div class="notice">※ 지금 답변은 미리 정해둔 가짜 답입니다.</div>
  </div>

  <script>
    const replies = [
      '안녕하세요, 김대희 님! 🍊 저는 제주도 특산물을 알아봐 드리는 에이전트예요. 어떤 특산물이 궁금하세요? 귤, 흑돼지, 한라봉 중에 골라 주셔도 좋아요!',
      '지금 같은 계절에는 감귤을 추천드려요! 🍊 새콤달콤하고, 농장 체험으로 직접 따 보기에도 좋아요.',
      '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.',
    ];
    let turn = 0;
    const log = document.getElementById('log');

    function add(text, who) {
      const d = document.createElement('div');
      d.className = 'msg ' + who;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;
      add(text, 'me');
      input.value = '';
      const reply = replies[turn++ % replies.length];
      setTimeout(() => add(reply, 'bot'), 1000);
    });
  </script>
</body>
</html>
