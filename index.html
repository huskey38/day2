<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카운터</title>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; gap: 1rem; }
  #count { font-size: 4rem; }
  button { font-size: 1.5rem; padding: .5rem 1.5rem; cursor: pointer; }
</style>
</head>
<body>
  <div id="count">0</div>
  <button id="btn">+2</button>
  <script>
    let n = 0;
    const count = document.getElementById('count');
    document.getElementById('btn').addEventListener('click', () => {
      n += 2;
      count.textContent = n;
    });
  </script>
</body>
</html>
